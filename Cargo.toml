[package]
name = "squeeze264"
version = "0.1.0"
edition = "2021"
description = "An H.264 Constrained Baseline video encoder written from scratch, verified bit-exact against real decoders"
license = "MIT"
publish = false

[dependencies]

[profile.release]
opt-level = 3
debug = false

[profile.test]
opt-level = 2

[lints.clippy]
# Codec kernels index several arrays with the same coordinates and pass
# block geometry explicitly; iterator rewrites would obscure the equations.
needless_range_loop = "allow"
too_many_arguments = "allow"
